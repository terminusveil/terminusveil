<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Terminus Veil · deploy (owner, localhost)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0d0a; color: #e6e8e0; font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  .muted { color: #8a9282; }
  .box { border: 1px solid #2a3026; border-radius: 10px; padding: 16px; margin-top: 16px; background: #10130e; }
  button { font: inherit; padding: 10px 16px; border-radius: 999px; border: 1px solid #c8ff3a; background: #c8ff3a; color: #0b0d0a; cursor: pointer; }
  button.ghost { background: transparent; color: #e6e8e0; border-color: #3a4236; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  label { display: block; margin-top: 10px; color: #8a9282; font-size: 13px; }
  input, select { font: inherit; width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; border: 1px solid #3a4236; background: #0b0d0a; color: #e6e8e0; }
  code { color: #c8ff3a; word-break: break-all; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .ok { color: #c8ff3a; } .bad { color: #ff7a7a; }
  #log { white-space: pre-wrap; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Terminus Veil · deploy</h1>
  <p class="muted">Owner tool on localhost. Your browser wallet signs; no key touches this page or the terminal.</p>

  <div class="box">
    <div class="row" id="wallets"><span class="muted">looking for wallets…</span></div>
    <div class="row">
      <span id="account" class="muted">not connected</span>
    </div>
    <div class="row">
      <span>chain: <span id="chain" class="muted">—</span></span>
      <button id="switch" class="ghost" disabled>Switch to Robinhood Chain</button>
      <span>balance: <span id="balance" class="muted">—</span></span>
    </div>
  </div>

  <div class="box">
    <label for="contract">contract</label>
    <select id="contract">
      <option value="TerminusWire">TerminusWire (phase 1, the Wire)</option>
      <option value="VeilPass">VeilPass (phase 2, with the Key; needs $VEIL first)</option>
    </select>
    <div id="passArgs" hidden>
      <label>veil ($VEIL token address)</label><input id="veil" placeholder="0x…" />
      <label>house (wallet that receives the unburned share)</label><input id="house" placeholder="0x…" />
      <label>burnBps (1..10000; 2500 = 25% burns)</label><input id="burnBps" placeholder="2500" />
      <label>priceWei (price in $VEIL wei, 18 decimals; 1000 $VEIL = 1000000000000000000000)</label><input id="priceWei" placeholder="1000000000000000000000" />
      <label>priceSetter (wallet allowed to change the price)</label><input id="priceSetter" placeholder="0x…" />
    </div>
    <div class="row">
      <button id="deploy" disabled>Deploy</button>
      <span id="state" class="muted"></span>
    </div>
  </div>

  <div class="box">
    <div>result</div>
    <div id="result" class="muted">nothing deployed yet</div>
    <div class="row" id="copyRow" hidden>
      <button id="copy" class="ghost">Copy address</button>
      <a id="explorer" target="_blank" rel="noreferrer">Explorer ↗</a>
    </div>
  </div>

  <div class="box"><div id="log" class="muted"></div></div>
</main>
<script>
const CHAIN = {
  chainId: "0x1237", // 4663
  chainName: "Robinhood Chain",
  nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 },
  rpcUrls: ["https://rpc.mainnet.chain.robinhood.com"],
  blockExplorerUrls: ["https://robinhoodchain.blockscout.com"],
};
const $ = (id) => document.getElementById(id);
const log = (m, cls) => { const d = document.createElement("div"); d.textContent = m; if (cls) d.className = cls; $("log").prepend(d); };
let account = null;
let chainId = null;
let provider = null;
const found = new Map(); // uuid → { name, provider }

const eth = () => provider;

function renderWallets() {
  const row = $("wallets");
  row.innerHTML = "";
  if (found.size === 0) {
    const ua = navigator.userAgent;
    const browser = /Edg\//.test(ua) ? "Edge" : /OPR\//.test(ua) ? "Opera" : /Brave/.test(ua) || navigator.brave ? "Brave" : /Chrome\//.test(ua) ? "Chrome" : /Firefox\//.test(ua) ? "Firefox" : "unknown browser";
    const embedded = /Electron|wv\)/i.test(ua) ? " inside an app window (extensions cannot load here)" : "";
    row.innerHTML = `<span class="bad">No wallet detected.</span> <span class="muted">This page is running in ${browser}${embedded}. window.ethereum is ${window.ethereum ? "present but announced no wallet" : "absent"}. Open <code>http://localhost:8787</code> in the Chrome profile where Rabby is installed and unlocked, then reload. In Rabby: Settings → "Rabby as default wallet" on.</span>`;
    return;
  }
  for (const [uuid, w] of found) {
    const b = document.createElement("button");
    b.textContent = `Connect ${w.name}`;
    b.onclick = () => connect(uuid);
    row.appendChild(b);
  }
}

// EIP-6963: wallets announce themselves; the legacy window.ethereum is the fallback.
window.addEventListener("eip6963:announceProvider", (ev) => {
  const { info, provider: p } = ev.detail;
  if (!found.has(info.uuid)) { found.set(info.uuid, { name: info.name, provider: p }); renderWallets(); }
});
window.dispatchEvent(new Event("eip6963:requestProvider"));
setTimeout(() => {
  if (found.size === 0 && window.ethereum) {
    const name = window.ethereum.isRabby ? "Rabby" : window.ethereum.isMetaMask ? "MetaMask" : "browser wallet";
    found.set("legacy", { name, provider: window.ethereum });
  }
  renderWallets();
}, 800);

async function connect(uuid) {
  provider = found.get(uuid).provider;
  const accounts = await provider.request({ method: "eth_requestAccounts" });
  account = accounts[0];
  $("account").textContent = `${found.get(uuid).name} · ${account}`;
  $("account").className = "ok";
  log(`connected ${account} via ${found.get(uuid).name}`);
  provider.on?.("chainChanged", () => refresh());
  provider.on?.("accountsChanged", (a) => { account = a[0] ?? null; $("account").textContent = account ?? "not connected"; refresh(); });
  await refresh();
}
const hexAddr = (v) => /^0x[0-9a-fA-F]{40}$/.test(v.trim());

async function refresh() {
  if (!eth() || !account) return;
  chainId = await eth().request({ method: "eth_chainId" });
  const onChain = chainId.toLowerCase() === CHAIN.chainId;
  $("chain").textContent = onChain ? "Robinhood Chain · 4663" : `${parseInt(chainId, 16)} (wrong chain)`;
  $("chain").className = onChain ? "ok" : "bad";
  $("switch").disabled = onChain;
  $("deploy").disabled = !onChain;
  try {
    const wei = BigInt(await eth().request({ method: "eth_getBalance", params: [account, "latest"] }));
    const whole = wei / 10n ** 18n;
    const frac = (wei % 10n ** 18n).toString().padStart(18, "0").slice(0, 5);
    $("balance").textContent = `${whole}.${frac} ETH`;
    $("balance").className = wei === 0n ? "bad" : "ok";
  } catch (e) { $("balance").textContent = "—"; }
}

$("switch").onclick = async () => {
  try {
    await eth().request({ method: "wallet_switchEthereumChain", params: [{ chainId: CHAIN.chainId }] });
  } catch (err) {
    if (err && (err.code === 4902 || /unrecognized|not added/i.test(String(err.message)))) {
      await eth().request({ method: "wallet_addEthereumChain", params: [CHAIN] });
    } else { log(`switch failed: ${err.message ?? err}`, "bad"); return; }
  }
  await refresh();
};

$("contract").onchange = () => { $("passArgs").hidden = $("contract").value !== "VeilPass"; };

function passArgs() {
  const veil = $("veil").value.trim(), house = $("house").value.trim(), setter = $("priceSetter").value.trim();
  const bps = Number($("burnBps").value.trim()); const price = $("priceWei").value.trim();
  if (!hexAddr(veil) || !hexAddr(house) || !hexAddr(setter)) throw new Error("veil, house and priceSetter must be 0x addresses");
  if (!Number.isInteger(bps) || bps < 1 || bps > 10000) throw new Error("burnBps must be 1..10000");
  if (!/^\d+$/.test(price) || price === "0") throw new Error("priceWei must be a positive integer");
  return [veil, house, bps, price, setter];
}

async function waitReceipt(hash) {
  for (let i = 0; i < 120; i += 1) {
    const r = await eth().request({ method: "eth_getTransactionReceipt", params: [hash] });
    if (r) return r;
    await new Promise((res) => setTimeout(res, 2500));
  }
  throw new Error("no receipt after 5 minutes; check the explorer for the tx");
}

$("deploy").onclick = async () => {
  const name = $("contract").value;
  try {
    $("deploy").disabled = true;
    $("state").textContent = "preparing…";
    const args = name === "VeilPass" ? passArgs() : [];
    const q = new URLSearchParams({ contract: name, args: JSON.stringify(args) });
    const prep = await fetch(`/data?${q}`).then((r) => r.json());
    if (prep.error) throw new Error(prep.error);
    log(`${name}: creation bytecode ${(prep.data.length - 2) / 2} bytes${args.length ? `, args ${JSON.stringify(args)}` : ""}`);
    $("state").textContent = "confirm in your wallet…";
    const hash = await eth().request({ method: "eth_sendTransaction", params: [{ from: account, data: prep.data }] });
    log(`tx ${hash}`);
    $("state").textContent = "waiting for the receipt…";
    const r = await waitReceipt(hash);
    if (r.status !== "0x1" || !r.contractAddress) throw new Error(`deploy reverted (status ${r.status})`);
    const addr = r.contractAddress;
    $("result").innerHTML = `${name} <code>${addr}</code><br>block ${parseInt(r.blockNumber, 16)} · tx <code>${hash}</code>`;
    $("result").className = "";
    $("copyRow").hidden = false;
    $("copy").onclick = () => navigator.clipboard.writeText(addr);
    $("explorer").href = `${CHAIN.blockExplorerUrls[0]}/address/${addr}`;
    $("state").textContent = "deployed";
    log(`${name} deployed at ${addr}`, "ok");
    await refresh();
  } catch (err) {
    $("state").textContent = "failed";
    log(`failed: ${err.message ?? err}`, "bad");
    $("deploy").disabled = false;
  }
};

</script>
</body>
</html>
